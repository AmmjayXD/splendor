<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Splendor ออนไลน์</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Itim&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--ink:#1e120a;--parch:#f4e4bd;--gold:#ffc23d;--teal:#2fb7a6;--line:#8a5a2b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Mali,Prompt,system-ui,sans-serif;color:#fdf3dc;padding:12px;background:radial-gradient(circle at 18% 12%,#1f5a70 0,transparent 45%),radial-gradient(circle at 88% 8%,#53306e 0,transparent 40%),#0f1d29;background-attachment:fixed}
body:before{content:'';position:fixed;inset:0;background-image:radial-gradient(#fff8 1px,transparent 1.6px),radial-gradient(#fff6 1px,transparent 1.6px);background-size:90px 90px,140px 140px;background-position:0 0,40px 60px;opacity:.5;pointer-events:none;animation:star 5s infinite alternate}
@keyframes star{to{opacity:.2}}
.wrap{max-width:1340px;margin:auto;position:relative}
h1{margin:2px 0 8px;font-size:30px;color:var(--gold);text-shadow:3px 3px 0 var(--ink);letter-spacing:2px}
.tools{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;display:flex;gap:8px;z-index:30}
.tools button{width:44px;height:44px;border-radius:12px;border:3px solid var(--ink);background:var(--parch);font-size:20px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.panel{background:linear-gradient(#573622,#3f2616);border:4px solid var(--ink);border-radius:14px;padding:12px;margin:10px 0;box-shadow:0 5px 0 var(--ink),inset 0 0 0 2px var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lab{font-size:13px;color:var(--gold);font-weight:700}
.sec{font-size:17px;font-weight:700;color:var(--gold);margin-bottom:6px;text-shadow:2px 2px 0 var(--ink)}
.hint{font-size:14px;margin:6px 0}.leg{font-size:12px;opacity:.85;margin:4px 0 8px}.warn{color:#ffb4a8;font-weight:700}
.game{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(310px,1fr);gap:16px;align-items:start}
@media(max-width:900px){.game{grid-template-columns:1fr}}
.act{position:sticky;top:8px;z-index:6}@media(max-width:900px){.act{position:static}}
.lv{display:flex;gap:10px;overflow-x:auto;padding:14px 8px 10px}
.deck{min-width:78px;border-radius:12px;background:repeating-linear-gradient(45deg,#5b3a8a,#5b3a8a 7px,#47286f 7px,#47286f 14px);border:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;padding:6px;text-align:center;box-shadow:3px 4px 0 #000a}
.card{min-width:92px;width:92px;height:130px;border-radius:10px;background:linear-gradient(165deg,var(--parch) 42%,var(--gc,#ddd));color:var(--ink);border:3px solid var(--ink);cursor:pointer;position:relative;overflow:hidden;box-shadow:3px 4px 0 #000a;transition:transform .15s;flex:none}
.card:hover{transform:translateY(-5px) rotate(-1.5deg)}
.card.sel{outline:4px solid var(--gold);outline-offset:1px}
.card.empty{background:#ffffff12;border-style:dashed;box-shadow:none;cursor:default}
.card .top{height:36px;padding:2px 8px;display:flex;justify-content:space-between;align-items:center;background:var(--gc);border-bottom:3px solid var(--ink);font-weight:700;font-size:17px}
.card .bi svg{width:26px;height:26px}
.cost{position:absolute;left:5px;bottom:5px;display:flex;flex-direction:column;gap:2px}
.cost span{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:700;background:var(--ink);color:#fff;border-radius:10px;padding:0 7px 0 3px;width:fit-content}
.art{position:absolute;right:5px;bottom:8px;font-size:32px;filter:drop-shadow(2px 3px 0 #0006)}
.card.fresh{animation:pop .5s both,glowc 3s}
@keyframes pop{from{transform:scale(.6) translateY(14px);opacity:0}}
@keyframes glowc{from{box-shadow:0 0 0 4px #86efac,0 0 28px #86efac}}
.card.fresh:after{content:'✨ใหม่';position:absolute;top:40px;right:3px;background:#22c55e;color:#fff;border-radius:8px;font-size:9px;padding:0 4px;animation:fo 3s forwards}
@keyframes fo{75%{opacity:1}to{opacity:0}}
.slot{display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px}
.noble{min-width:84px;border-radius:12px;padding:6px;text-align:center;background:linear-gradient(160deg,#ffe98c,#d9972a);color:var(--ink);border:3px solid var(--ink);box-shadow:3px 4px 0 #000a;font-weight:700;animation:pop .4s both}
.noble .r{display:flex;gap:3px;justify-content:center;margin-top:4px;flex-wrap:wrap}
.gi{width:1.25em;height:1.25em;vertical-align:-.3em;display:inline-block}
.pip{display:inline-flex;align-items:center;gap:1px;background:var(--ink);color:#fff;border-radius:12px;padding:1px 8px 1px 3px;font-weight:700;font-size:13px;margin:0 3px 3px 0;border:0;font-family:inherit}
.noble .pip{padding:1px 6px 1px 2px}
button.dsc{cursor:pointer;outline:2px solid #ffb4a8}
.gem{width:68px;height:76px;background:transparent;border:0;cursor:pointer;position:relative;padding:0;font-family:inherit}
.gem .gs{display:block;width:60px;height:60px;margin:auto;filter:drop-shadow(0 4px 0 #0008);transition:transform .15s}
.gem .gs svg{width:100%;height:100%}
.gem b{position:absolute;bottom:0;right:2px;min-width:27px;height:27px;border-radius:14px;background:var(--parch);color:var(--ink);border:3px solid var(--ink);font-size:14px;line-height:21px}
.gem:hover:not(:disabled) .gs{transform:translateY(-4px) rotate(-6deg)}
.gem.s .gs{transform:scale(1.18);filter:drop-shadow(0 0 10px var(--gold)) drop-shadow(0 4px 0 #0008)}
.gem sup{position:absolute;top:-2px;right:0;background:var(--gold);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:0 6px;font-size:12px;font-weight:700}
button.b{background:linear-gradient(#ffd45e,#f5a30f);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:8px 14px;font:700 14px Mali,Prompt,sans-serif;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .1s}
button.b:hover:not(:disabled){filter:brightness(1.08)}button.b:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}button.b:disabled{opacity:.4;cursor:default}
.p{border:3px solid var(--ink);border-radius:12px;padding:10px;margin:10px 0;background:#00000030}
.p.me{background:#ffc23d26}.p.turn{border-color:var(--gold);animation:glow 1.5s infinite alternate}
@keyframes glow{from{box-shadow:0 0 6px #ffc23d66}to{box-shadow:0 0 22px #ffc23dcc}}
.p.got{animation:got 1.4s}@keyframes got{30%{transform:scale(1.03);box-shadow:0 0 30px var(--gold)}}
.pn{font-weight:700;font-size:17px}.sc{float:right;background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:0 12px;font-weight:700}
.line{margin-top:5px}
.res .card{zoom:.58}
.bought{display:flex;flex-wrap:wrap;padding-left:46px;margin-top:4px}
.bought .card{zoom:.4;margin-left:-46px;margin-top:3px}.bought .card:hover{z-index:3;transform:translateY(-8px)}
input,select{padding:10px 12px;border-radius:10px;border:3px solid var(--ink);background:var(--parch);color:var(--ink);font:600 15px Mali,Prompt,sans-serif}
.log{font-size:12px;max-height:110px;overflow:auto}
.banner{padding:10px;border-radius:12px;background:linear-gradient(90deg,#ffd45e,#ff9fb5,#ffd45e);background-size:200%;animation:sl 3s linear infinite;color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-weight:700;text-align:center;font-size:18px;margin:6px 0 10px}
@keyframes sl{to{background-position:200%}}
.modal{position:fixed;inset:0;background:#000b;z-index:40;display:flex;align-items:center;justify-content:center;padding:14px}
.modal[hidden]{display:none}.modal>div{background:#3f2616;border:4px solid var(--ink);border-radius:16px;max-width:560px;max-height:90vh;overflow:auto;padding:20px;line-height:1.7}
.modal h2{margin:0 0 8px;color:var(--gold)}.modal li{margin:4px 0}
.modal .bk{background:transparent;border:0;position:absolute;inset:0;max-width:none;max-height:none;padding:0}
.dlg{position:relative;text-align:center;max-width:380px!important;width:100%;box-shadow:0 20px 50px #000c;animation:pop .25s both}
.big{zoom:2;display:flex;justify-content:center;margin:6px 0 10px}.big .card{cursor:default;transform:none!important}
.fly{position:fixed;z-index:50;pointer-events:none;margin:0}.fly .card{width:100%;height:100%;transform:none;min-width:0}.fly .gm{width:100%;height:100%;filter:drop-shadow(0 6px 0 #0008)}.fly .gm svg{width:100%;height:100%}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:60;background:var(--parch);color:var(--ink);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);border-radius:14px;padding:10px 18px;animation:pop .3s both;max-width:92vw;text-align:center;font-weight:700;font-size:16px}
/* หน้าแรก */
.hero{display:flex;gap:22px;flex-wrap:wrap;align-items:center;justify-content:center}
.stage{width:min(400px,92vw)}.merch{width:100%;height:auto;display:block}
.bubble{background:var(--parch);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:6px 12px;text-align:center;font-weight:700;margin-bottom:6px;animation:bob 2.4s ease-in-out infinite}
.menu{flex:1;min-width:290px;max-width:560px}
.mbody{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}
.arm{transform-origin:204px 180px;animation:wave 2.4s ease-in-out infinite}@keyframes wave{50%{transform:rotate(-9deg)}}
.dia{transform-box:fill-box;transform-origin:center;animation:dsp 2.6s ease-in-out infinite}@keyframes dsp{50%{transform:scale(1.2) rotate(9deg)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.sp{font-size:22px;transform-box:fill-box;transform-origin:center;animation:tw2 1.8s infinite}.s2{animation-delay:.6s}.s3{animation-delay:1.1s}
@keyframes tw2{0%,100%{opacity:.1;transform:scale(.5)}50%{opacity:1;transform:scale(1.25)}}
</style></head><body><div class="wrap">
<div class="tools"><button id="bm" title="เพลง">🎵</button><button id="bs" title="เสียงเอฟเฟกต์">🔊</button></div><h1>💎 SPLENDOR</h1><div id="app" class="panel">กำลังโหลด...</div></div>
<script>
const COL=['ขาว','น้ำเงิน','เขียว','แดง','ดำ','ทอง'],HEX=['#f1f5f9','#4f9cf9','#3fc36e','#ef5350','#6b7280','#f2c230'];
const T=[[[0,1,1,1,1,0],[0,1,2,1,1,0],[0,2,2,0,1,0],[0,0,0,1,3,1],[0,0,0,2,1,0],[0,2,0,2,0,0],[0,0,0,3,0,0],[1,0,0,0,4,0]],
[[1,3,2,2,0,0],[1,3,0,3,0,2],[2,0,0,1,4,2],[2,0,0,0,5,3],[2,0,0,0,5,0],[3,0,0,0,0,6]],
[[3,3,3,5,3,0],[4,7,0,0,0,0],[4,3,6,0,0,3],[5,7,0,0,0,3]]];
const C=[];T.forEach((L,l)=>{for(let o=0;o<5;o++)L.forEach(t=>{const c=[0,0,0,0,0];[1,2,3,4,0].forEach((k,j)=>c[(o+k)%5]=t[j+1]);C.push({l,o,p:t[0],c})})});
const NB=[[4,4,0,0,0],[0,4,4,0,0],[0,0,4,4,0],[0,0,0,4,4],[4,0,0,0,4],[3,3,3,0,0],[0,3,3,3,0],[0,0,3,3,3],[3,0,0,3,3],[3,3,0,0,3]];
const $=s=>document.querySelector(s),app=$('#app'),clone=o=>JSON.parse(JSON.stringify(o));
let solo=false,peer,conns={},hostConn=null,isHost=false,S=null,uid,myName='',code='',sel=[],selC=null,msg='';
try{uid=sessionStorage.getItem('spl_u');myName=localStorage.getItem('spl_n')||''}catch(e){}
if(!uid){uid='u'+Math.random().toString(36).slice(2,10);try{sessionStorage.setItem('spl_u',uid)}catch(e){}}
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pts=p=>p.cards.reduce((a,i)=>a+C[i].p,0)+p.nobles.length*3;
const bon=p=>{const b=[0,0,0,0,0];p.cards.forEach(i=>b[C[i].o]++);return b};
const tot=p=>p.g.reduce((a,b)=>a+b,0);
const need=(p,c)=>{const b=bon(p);let n=0;for(let i=0;i<5;i++)n+=Math.max(0,c.c[i]-b[i]-p.g[i]);return n};
const canBuy=(p,id)=>need(p,C[id])<=p.g[5];
const myIdx=()=>S&&S.players?S.players.findIndex(p=>p.uid===uid):-1;
const myTurn=()=>S&&S.phase==='play'&&myIdx()===S.turn;
/* ---------- กติกา (ทำงานบนเครื่องเจ้าของห้องเท่านั้น) ---------- */
function newGame(s){const n=s.players.length,g=n==2?4:n==3?5:7;
  s.bank=[g,g,g,g,g,5];s.deck=[0,1,2].map(l=>sh(C.map((c,i)=>i).filter(i=>C[i].l===l)));
  s.table=s.deck.map(d=>[d.pop(),d.pop(),d.pop(),d.pop()]);s.nobles=sh(NB.map((x,i)=>i)).slice(0,n+1);
  s.players.forEach(p=>Object.assign(p,{g:[0,0,0,0,0,0],res:[],cards:[],nobles:[]}));
  sh(s.players);s.turn=0;s.phase='play';s.end=false;s.disc=false;s.log=['เริ่มเกม! ผู้เล่นแรก: '+s.players[0].name]}
function finish(s){const p=s.players[s.turn];p.last=(s.log[s.log.length-1]||'').replace(p.name+' ','');if(tot(p)>10){s.disc=true;return}s.disc=false;
  const b=bon(p),ni=s.nobles.findIndex(k=>NB[k].every((r,i)=>b[i]>=r));
  if(ni>=0){p.nobles.push(s.nobles.splice(ni,1)[0]);s.log.push(p.name+' ได้ขุนนาง +3 แต้ม')}
  if(pts(p)>=15&&!s.end){s.end=true;s.log.push('มีผู้ถึง 15 แต้ม! เล่นให้ครบรอบ')}
  s.turn=(s.turn+1)%s.players.length;if(s.end&&s.turn===0)s.phase='over';s.log=s.log.slice(-8)}
function takeCard(s,id){for(let l=0;l<3;l++){const k=s.table[l].indexOf(id);if(k>=0){s.table[l][k]=s.deck[l].pop()??null;return true}}return false}
function handle(u,a){
  if(a.t==='join'){if(!S)return;const s=clone(S),ex=s.players.find(p=>p.uid===u);
    if(ex)ex.name=a.name;else if(s.phase==='lobby'&&s.players.length<4)s.players.push({uid:u,name:a.name,av:AV[s.players.length]});else return;return commit(s)}
  if(!S)return;const s=clone(S);
  if((a.t==='start'||a.t==='again')&&u===s.host&&(s.phase==='lobby'||s.phase==='over')&&s.players.length>1){newGame(s);return commit(s)}
  if(s.phase!=='play')return;const i=s.players.findIndex(p=>p.uid===u);if(i!==s.turn)return;const p=s.players[i];
  if(a.t==='disc'){if(!s.disc||!p.g[a.i])return;p.g[a.i]--;s.bank[a.i]++;finish(s)}
  else if(s.disc)return;
  else if(a.t==='take'){const q=a.sel||[],av=[0,1,2,3,4].filter(k=>s.bank[k]>0).length;
    const pair=q.length===2&&q[0]===q[1]&&s.bank[q[0]]>=4,tri=new Set(q).size===q.length&&q.length===Math.min(3,av)&&q.every(k=>k<5&&s.bank[k]>0);
    if(!pair&&!tri)return;q.forEach(k=>{s.bank[k]--;p.g[k]++});s.log.push(p.name+' เก็บเหรียญ '+q.map(k=>COL[k]).join(', '));finish(s)}
  else if(a.t==='buy'){const id=a.id,r=p.res.indexOf(id);if(r<0&&!s.table.some(x=>x.includes(id)))return;if(!canBuy(p,id))return;
    const c=C[id],b=bon(p);let gold=0;for(let k=0;k<5;k++){const d=Math.max(0,c.c[k]-b[k]),w=Math.min(d,p.g[k]);p.g[k]-=w;s.bank[k]+=w;gold+=d-w}
    p.g[5]-=gold;s.bank[5]+=gold;if(r>=0)p.res.splice(r,1);else takeCard(s,id);p.cards.push(id);s.log.push(p.name+' ซื้อการ์ด (+'+COL[c.o]+')');finish(s)}
  else if(a.t==='res'){if(p.res.length>=3)return;let id=a.id;
    if(a.deck!=null){id=s.deck[a.deck]?.pop();if(id==null)return}else if(!takeCard(s,id))return;
    p.res.push(id);if(s.bank[5]>0){s.bank[5]--;p.g[5]++}s.log.push(p.name+' จองการ์ด');finish(s)}
  else if(a.t==='pass'&&String(u).startsWith('bot')){s.log.push(p.name+' ข้ามตา');finish(s)}
  else return;
  commit(s)}
function commit(s){S=s;sel=[];selC=null;render();Object.entries(conns).forEach(([u,c])=>c.open&&c.send(view(s,u)));botTick()}
function view(s,u){const v=clone(s);if(v.deck)v.deck=v.deck.map(d=>d.map(()=>-1));return v}
function send(a){a.uid=uid;if(isHost)handle(uid,a);else if(hostConn&&hostConn.open)hostConn.send(a);else{msg='ยังไม่ได้เชื่อมต่อกับห้อง';render()}}
/* ---------- เครือข่าย ---------- */
const ICE_EXTRA=[]; /* ใส่เซิร์ฟเวอร์ TURN ของคุณเองที่นี่ได้ เช่น {urls:'turn:...',username:'...',credential:'...'} */
const PCFG={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun2.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'},{urls:'stun:global.stun.twilio.com:3478'},...ICE_EXTRA]}};
let netMsg='',wl=null;
function hostStatus(t){netMsg=t;if(S&&S.phase==='lobby'&&isHost)render()}
async function keepAwake(){try{if(navigator.wakeLock)wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&isHost&&!solo){keepAwake();if(peer&&peer.disconnected&&!peer.destroyed)peer.reconnect()}});
function createRoom(){myName=nm();code=Math.random().toString(36).slice(2,6).toUpperCase();isHost=true;solo=false;
  if(peer&&!peer.destroyed)peer.destroy();
  peer=new Peer('splendor-'+code,PCFG);
  peer.on('open',()=>{if(!S||S.host!==uid)S={phase:'lobby',host:uid,players:[{uid,name:myName,av:AV[0]}],log:[]};location.hash=code;hostStatus('🟢 พร้อมรับเพื่อน');render()});
  peer.on('disconnected',()=>{hostStatus('🟡 หลุดจากเซิร์ฟเวอร์กลาง กำลังต่อใหม่...');setTimeout(()=>{if(peer&&peer.disconnected&&!peer.destroyed)peer.reconnect()},1000)});
  peer.on('error',e=>{if(e.type==='unavailable-id')createRoom();
    else if(['network','server-error','socket-error','socket-closed'].includes(e.type)){hostStatus('🟡 เครือข่ายมีปัญหา ('+e.type+') กำลังลองใหม่...');setTimeout(()=>{if(peer&&peer.disconnected&&!peer.destroyed)peer.reconnect()},2500)}
    else hostStatus('❌ '+e.type)});
  peer.on('connection',c=>{c.on('data',d=>{conns[d.uid]=c;if(d.t==='join'&&S&&S.players.some(p=>p.uid===d.uid)&&S.phase!=='lobby')c.send(view(S,d.uid));handle(d.uid,d)})});
  keepAwake()}
function joinRoom(){myName=nm();code=$('#cd').value.trim().toUpperCase();if(!code)return;isHost=false;solo=false;
  const er=t=>{const e=$('#er');if(e)e.textContent=t};er('⏳ กำลังเชื่อมต่อ...');let tries=0,done=false;
  const attempt=()=>{if(peer&&!peer.destroyed)peer.destroy();peer=new Peer(PCFG);
    const timer=setTimeout(()=>{if(!done)er('⌛ ยังเชื่อมต่อไม่ได้ — เครือข่ายของคุณหรือเจ้าของห้องอาจบล็อกการเชื่อมต่อตรง (ลองสลับ Wi-Fi/4G หรือใช้ Wi-Fi เดียวกัน) หรือเจ้าของห้องปิดหน้าเว็บไปแล้ว')},15000);
    peer.on('open',()=>{hostConn=peer.connect('splendor-'+code,{reliable:true});
      hostConn.on('open',()=>{done=true;clearTimeout(timer);location.hash=code;hostConn.send({t:'join',uid,name:myName})});
      hostConn.on('data',d=>{S=d;msg='';render()});
