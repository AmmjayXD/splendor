<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Splendor ออนไลน์</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--gold:#ffd166;--vio:#8b5cf6;--ink:#241a2e;--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.18)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Prompt,system-ui,sans-serif;color:#f5f1ff;padding:14px;
background:radial-gradient(circle at 12% 8%,#6d28d9 0,transparent 42%),radial-gradient(circle at 88% 18%,#0e9f9d 0,transparent 38%),radial-gradient(circle at 50% 105%,#be185d 0,transparent 45%),#140d24;background-attachment:fixed}
body:after{content:'✨';position:fixed;right:6%;bottom:8%;font-size:34px;opacity:.5;animation:tw 3s infinite alternate;pointer-events:none}
@keyframes tw{to{opacity:.1;transform:scale(1.5) rotate(20deg)}}
.wrap{max-width:1020px;margin:auto}
h1{margin:4px 0 10px;font-size:30px;font-weight:700;letter-spacing:2px;background:linear-gradient(90deg,#ffd166,#f472b6,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.tools{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;display:flex;gap:8px;z-index:9}
.tools button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#0006;backdrop-filter:blur(8px);font-size:20px;cursor:pointer}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:14px;margin:12px 0;backdrop-filter:blur(14px);box-shadow:0 10px 30px #0006}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lab{font-size:12px;color:var(--gold);letter-spacing:1px;font-weight:600}
.lv{display:flex;gap:10px;overflow-x:auto;padding:6px 4px}
.deck{min-width:78px;border-radius:16px;background:linear-gradient(160deg,#7c3aed,#4c1d95);border:2px solid #ffffff55;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;padding:6px;text-align:center;box-shadow:0 6px 14px #0006}
.card{min-width:92px;width:92px;height:128px;border-radius:16px;background:linear-gradient(160deg,#fffdf7,#f1e4c8);color:var(--ink);cursor:pointer;position:relative;overflow:hidden;box-shadow:0 6px 14px #0007;transition:transform .18s,box-shadow .18s;flex:none;animation:pop .35s both}
@keyframes pop{from{transform:scale(.6) translateY(14px);opacity:0}}
.card:hover{transform:translateY(-5px) rotate(-1deg)}
.card.sel{transform:translateY(-10px);box-shadow:0 0 0 3px var(--gold),0 0 22px #ffd166aa,0 12px 20px #000a}
.card.empty{background:#ffffff14;box-shadow:none;cursor:default}
.card .top{height:38px;padding:3px 9px;display:flex;justify-content:space-between;align-items:center;color:#fff;text-shadow:0 1px 3px #0008}
.card .top b{font-size:18px}.card .em{font-size:22px}
.dot{display:inline-block;border-radius:50%;border:1.5px solid #0006;background-image:radial-gradient(circle at 30% 30%,#fffa,#fff0 60%)}
.cost{position:absolute;left:8px;bottom:7px;display:flex;flex-direction:column;gap:3px}
.cost span{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.cost .dot{width:17px;height:17px}
.noble{min-width:84px;border-radius:16px;padding:8px;text-align:center;background:linear-gradient(160deg,#fff1b8,#e0a526);color:var(--ink);box-shadow:0 6px 14px #0007;font-size:13px;font-weight:700;animation:pop .4s both}
.noble .r{display:flex;gap:4px;justify-content:center;margin-top:4px;flex-wrap:wrap}
.pip{display:inline-flex;min-width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#111;border:1.5px solid #0006;background-image:radial-gradient(circle at 30% 30%,#fffa,#fff0 60%)}
.mini{margin-right:3px}
.gem{width:64px;height:64px;border-radius:50%;border:3px solid #0004;font:700 20px Prompt;color:#111;cursor:pointer;background-image:radial-gradient(circle at 30% 26%,#fffd,#fff0 55%);box-shadow:0 6px 12px #0008,inset 0 -7px 10px #0004;position:relative;transition:transform .15s}
.gem:hover:not(:disabled){transform:scale(1.1) rotate(-6deg)}
.gem.s{box-shadow:0 0 0 4px var(--gold),0 0 20px #ffd166cc;transform:scale(1.14)}
.gem .e{position:absolute;top:-8px;left:-6px;font-size:20px}
.gem sup{position:absolute;top:-8px;right:-6px;background:var(--gold);color:var(--ink);border-radius:10px;padding:0 6px;font-size:12px}
button.b{background:linear-gradient(135deg,#ffd166,#f59e0b);color:var(--ink);border:0;border-radius:14px;padding:10px 16px;font:600 14px Prompt;cursor:pointer;box-shadow:0 4px 0 #a16207,0 8px 14px #0005;transition:transform .1s}
button.b:hover:not(:disabled){filter:brightness(1.08)}
button.b:active{transform:translateY(3px);box-shadow:0 1px 0 #a16207}button.b:disabled{opacity:.35;cursor:default}
.p{border-radius:20px;padding:12px;margin:10px 0;background:#00000030;border:1px solid transparent}
.p.me{background:#ffd16620}.p.turn{border-color:var(--gold);animation:glow 1.5s infinite alternate}
@keyframes glow{from{box-shadow:0 0 6px #ffd16655}to{box-shadow:0 0 24px #ffd166bb}}
.pn{font-weight:700;font-size:17px}.sc{float:right;background:linear-gradient(135deg,#ffd166,#f59e0b);color:var(--ink);border-radius:20px;padding:2px 14px;font-weight:700}
.p .card{min-width:68px;width:68px;height:96px;font-size:10px}
.p .card .top{height:28px}.p .card .top b{font-size:14px}.p .card .em{font-size:16px}
.p .cost span{font-size:10px}.p .cost .dot{width:12px;height:12px}
input{padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:#0006;color:#fff;font:15px Prompt}
.log{font-size:12px;opacity:.85;max-height:90px;overflow:auto}
.banner{padding:12px;border-radius:16px;background:linear-gradient(90deg,#ffd166,#f472b6,#ffd166);background-size:200%;animation:sl 3s linear infinite;color:var(--ink);font-weight:700;text-align:center;font-size:17px}
@keyframes sl{to{background-position:200%}}
.warn{color:#fda4af;font-weight:600}
</style></head><body><div class="wrap">
<div class="tools"><button id="bm" title="เพลง">🎵</button><button id="bs" title="เสียงเอฟเฟกต์">🔊</button></div><h1>💎 SPLENDOR</h1><div id="app" class="panel">กำลังโหลด...</div></div>
<script>
const COL=['ขาว','น้ำเงิน','เขียว','แดง','ดำ','ทอง'],HEX=['#f1f5f9','#4f9cf9','#3fc36e','#ef5350','#6b7280','#f2c230'];
const T=[[[0,1,1,1,1,0],[0,1,2,1,1,0],[0,2,2,0,1,0],[0,0,0,1,3,1],[0,0,0,2,1,0],[0,2,0,2,0,0],[0,0,0,3,0,0],[1,0,0,0,4,0]],
[[1,3,2,2,0,0],[1,3,0,3,0,2],[2,0,0,1,4,2],[2,0,0,0,5,3],[2,0,0,0,5,0],[3,0,0,0,0,6]],
[[3,3,3,5,3,0],[4,7,0,0,0,0],[4,3,6,0,0,3],[5,7,0,0,0,3]]];
const C=[];T.forEach((L,l)=>{for(let o=0;o<5;o++)L.forEach(t=>{const c=[0,0,0,0,0];[1,2,3,4,0].forEach((k,j)=>c[(o+k)%5]=t[j+1]);C.push({l,o,p:t[0],c})})});
const NB=[[4,4,0,0,0],[0,4,4,0,0],[0,0,4,4,0],[0,0,0,4,4],[4,0,0,0,4],[3,3,3,0,0],[0,3,3,3,0],[0,0,3,3,3],[3,0,0,3,3],[3,3,0,0,3]];
const $=s=>document.querySelector(s),app=$('#app'),clone=o=>JSON.parse(JSON.stringify(o));
let peer,conns={},hostConn=null,isHost=false,S=null,uid,myName='',code='',sel=[],selC=null,msg='';
try{uid=sessionStorage.getItem('spl_u');myName=localStorage.getItem('spl_n')||''}catch(e){}
if(!uid){uid='u'+Math.random().toString(36).slice(2,10);try{sessionStorage.setItem('spl_u',uid)}catch(e){}}
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pts=p=>p.cards.reduce((a,i)=>a+C[i].p,0)+p.nobles.length*3;
const bon=p=>{const b=[0,0,0,0,0];p.cards.forEach(i=>b[C[i].o]++);return b};
const tot=p=>p.g.reduce((a,b)=>a+b,0);
const need=(p,c)=>{const b=bon(p);let n=0;for(let i=0;i<5;i++)n+=Math.max(0,c.c[i]-b[i]-p.g[i]);return n};
const canBuy=(p,id)=>need(p,C[id])<=p.g[5];
const myIdx=()=>S&&S.players?S.players.findIndex(p=>p.uid===uid):-1;
const myTurn=()=>S&&S.phase==='play'&&myIdx()===S.turn;
/* ---------- กติกา (ทำงานบนเครื่องเจ้าของห้องเท่านั้น) ---------- */
function newGame(s){const n=s.players.length,g=n==2?4:n==3?5:7;
  s.bank=[g,g,g,g,g,5];s.deck=[0,1,2].map(l=>sh(C.map((c,i)=>i).filter(i=>C[i].l===l)));
  s.table=s.deck.map(d=>[d.pop(),d.pop(),d.pop(),d.pop()]);s.nobles=sh(NB.map((x,i)=>i)).slice(0,n+1);
  s.players.forEach(p=>Object.assign(p,{g:[0,0,0,0,0,0],res:[],cards:[],nobles:[]}));
  sh(s.players);s.turn=0;s.phase='play';s.end=false;s.disc=false;s.log=['เริ่มเกม! ผู้เล่นแรก: '+s.players[0].name]}
function finish(s){const p=s.players[s.turn];if(tot(p)>10){s.disc=true;return}s.disc=false;
  const b=bon(p),ni=s.nobles.findIndex(k=>NB[k].every((r,i)=>b[i]>=r));
  if(ni>=0){p.nobles.push(s.nobles.splice(ni,1)[0]);s.log.push(p.name+' ได้ขุนนาง +3 แต้ม')}
  if(pts(p)>=15&&!s.end){s.end=true;s.log.push('มีผู้ถึง 15 แต้ม! เล่นให้ครบรอบ')}
  s.turn=(s.turn+1)%s.players.length;if(s.end&&s.turn===0)s.phase='over';s.log=s.log.slice(-8)}
function takeCard(s,id){for(let l=0;l<3;l++){const k=s.table[l].indexOf(id);if(k>=0){s.table[l][k]=s.deck[l].pop()??null;return true}}return false}
function handle(u,a){
  if(a.t==='join'){if(!S)return;const s=clone(S),ex=s.players.find(p=>p.uid===u);
    if(ex)ex.name=a.name;else if(s.phase==='lobby'&&s.players.length<4)s.players.push({uid:u,name:a.name,av:AV[s.players.length]});else return;return commit(s)}
  if(!S)return;const s=clone(S);
  if((a.t==='start'||a.t==='again')&&u===s.host&&(s.phase==='lobby'||s.phase==='over')&&s.players.length>1){newGame(s);return commit(s)}
  if(s.phase!=='play')return;const i=s.players.findIndex(p=>p.uid===u);if(i!==s.turn)return;const p=s.players[i];
  if(a.t==='disc'){if(!s.disc||!p.g[a.i])return;p.g[a.i]--;s.bank[a.i]++;finish(s)}
  else if(s.disc)return;
  else if(a.t==='take'){const q=a.sel||[],av=[0,1,2,3,4].filter(k=>s.bank[k]>0).length;
    const pair=q.length===2&&q[0]===q[1]&&s.bank[q[0]]>=4,tri=new Set(q).size===q.length&&q.length===Math.min(3,av)&&q.every(k=>k<5&&s.bank[k]>0);
    if(!pair&&!tri)return;q.forEach(k=>{s.bank[k]--;p.g[k]++});s.log.push(p.name+' เก็บเหรียญ '+q.map(k=>COL[k]).join(', '));finish(s)}
  else if(a.t==='buy'){const id=a.id,r=p.res.indexOf(id);if(r<0&&!s.table.some(x=>x.includes(id)))return;if(!canBuy(p,id))return;
    const c=C[id],b=bon(p);let gold=0;for(let k=0;k<5;k++){const d=Math.max(0,c.c[k]-b[k]),w=Math.min(d,p.g[k]);p.g[k]-=w;s.bank[k]+=w;gold+=d-w}
    p.g[5]-=gold;s.bank[5]+=gold;if(r>=0)p.res.splice(r,1);else takeCard(s,id);p.cards.push(id);s.log.push(p.name+' ซื้อการ์ด (+'+COL[c.o]+')');finish(s)}
  else if(a.t==='res'){if(p.res.length>=3)return;let id=a.id;
    if(a.deck!=null){id=s.deck[a.deck]?.pop();if(id==null)return}else if(!takeCard(s,id))return;
    p.res.push(id);if(s.bank[5]>0){s.bank[5]--;p.g[5]++}s.log.push(p.name+' จองการ์ด');finish(s)}
  else return;
  commit(s)}
function commit(s){S=s;sel=[];selC=null;render();Object.values(conns).forEach(c=>c.open&&c.send(s))}
function send(a){a.uid=uid;if(isHost)handle(uid,a);else if(hostConn&&hostConn.open)hostConn.send(a);else{msg='ยังไม่ได้เชื่อมต่อกับห้อง';render()}}
/* ---------- เครือข่าย ---------- */
function createRoom(){myName=nm();code=Math.random().toString(36).slice(2,6).toUpperCase();isHost=true;
  peer=new Peer('splendor-'+code);
  peer.on('open',()=>{S={phase:'lobby',host:uid,players:[{uid,name:myName,av:AV[0]}],log:[]};location.hash=code;render()});
  peer.on('error',e=>{if(e.type==='unavailable-id')createRoom();else{app.innerHTML='สร้างห้องไม่ได้: '+e.type}});
  peer.on('connection',c=>{c.on('data',d=>{conns[d.uid]=c;if(d.t==='join'&&S&&S.players.some(p=>p.uid===d.uid)&&S.phase!=='lobby')c.send(S);handle(d.uid,d)})})}
function joinRoom(){myName=nm();code=$('#cd').value.trim().toUpperCase();if(!code)return;isHost=false;$('#er').textContent='กำลังเชื่อมต่อ...';
  peer=new Peer();peer.on('open',()=>{hostConn=peer.connect('splendor-'+code,{reliable:true});
    hostConn.on('open',()=>{location.hash=code;hostConn.send({t:'join',uid,name:myName})});
    hostConn.on('data',d=>{S=d;msg='';render()});hostConn.on('close',()=>{msg='ขาดการเชื่อมต่อกับห้อง — รีเฟรชหน้าแล้วเข้าห้องเดิมอีกครั้ง';render()})});
  peer.on('error',e=>{$('#er')?($('#er').textContent=e.type==='peer-unavailable'?'ไม่พบห้องนี้ (หรือเจ้าของห้องปิดหน้าเว็บไปแล้ว)':'เชื่อมต่อไม่ได้: '+e.type):0})}
function nm(){const n=($('#nm').value||'ผู้เล่น').trim().slice(0,14);try{localStorage.setItem('spl_n',n)}catch(e){}return n}
/* ---------- แสดงผล ---------- */
const AV=['🦊','🐼','🐯','🦄'],GE=['💎','🔷','🌿','🔥','🌑','⭐'];
/* ---------- เสียง (สังเคราะห์ด้วย Web Audio ไม่ต้องมีไฟล์) ---------- */
let AC,mg,sg,musOn=true,sndOn=true,nextT=0,stp=0,lk='';
try{musOn=localStorage.getItem('spl_m')!=='0';sndOn=localStorage.getItem('spl_s')!=='0'}catch(e){}
const CH=[[220,261.63,329.63,440],[174.61,220,261.63,349.23],[261.63,329.63,392,523.25],[196,246.94,293.66,392]];
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  mg=AC.createGain();mg.gain.value=musOn?.5:0;sg=AC.createGain();sg.gain.value=sndOn?.8:0;
  const dl=AC.createDelay();dl.delayTime.value=.32;const fb=AC.createGain();fb.gain.value=.35;
  mg.connect(AC.destination);mg.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(AC.destination);sg.connect(AC.destination);
  nextT=AC.currentTime+.1;setInterval(sched,120)}
  if(AC.state==='suspended')AC.resume()}
function tone(f,t,d,ty,v,dest){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05)}
function sched(){if(!AC)return;const b=60/84/2;
  while(nextT<AC.currentTime+.4){const ch=CH[Math.floor(stp/8)%4],k=stp%8;
    if(k===0)ch.slice(0,3).forEach(f=>tone(f/2,nextT,b*8,'sine',.09,mg));
    tone(ch[[0,2,1,3,2,1,3,2][k]]*(k%4===3?2:1),nextT,b*1.8,'triangle',.08,mg);nextT+=b;stp++}}
function sfx(n){if(!AC||!sndOn)return;const t=AC.currentTime,d=sg;
  const run=(a,gap,dur,ty,v)=>a.forEach((f,i)=>tone(f,t+i*gap,dur,ty,v,d));
  ({tick:()=>run([880],0,.08,'square',.05),take:()=>run([660,880],.07,.15,'sine',.2),buy:()=>run([523,659,784,1047],.08,.25,'triangle',.22),
  res:()=>run([400,300,500],.09,.18,'sawtooth',.07),noble:()=>run([523,659,784,1047,1319],.1,.4,'triangle',.25),
  turn:()=>run([988,1319],.12,.3,'sine',.25),win:()=>run([523,659,784,659,784,1047,1319],.14,.5,'triangle',.28)})[n]?.()}
function sfxCheck(){const l=(S.log&&S.log.length?S.log[S.log.length-1]:'');const k=S.phase+S.turn+l;if(k===lk)return;const first=lk==='';lk=k;
  if(first||S.phase==='lobby')return;
  sfx(S.phase==='over'?'win':/ขุนนาง/.test(l)?'noble':/ซื้อ/.test(l)?'buy':/จอง/.test(l)?'res':/เก็บ/.test(l)?'take':'tick');
  if(S.phase==='play'&&myTurn())setTimeout(()=>sfx('turn'),350)}
function paintTools(){$('#bm').textContent=musOn?'🎵':'🔇';$('#bs').textContent=sndOn?'🔊':'🔈'}
$('#bm').onclick=()=>{audioInit();musOn=!musOn;if(mg)mg.gain.value=musOn?.5:0;try{localStorage.setItem('spl_m',musOn?1:0)}catch(e){}paintTools()};
$('#bs').onclick=()=>{audioInit();sndOn=!sndOn;if(sg)sg.gain.value=sndOn?.8:0;try{localStorage.setItem('spl_s',sndOn?1:0)}catch(e){}paintTools();sfx('tick')};
document.addEventListener('pointerdown',audioInit);paintTools();
/* ---------- แสดงผล ---------- */
const pip=(i,n)=>`<span class="pip mini" style="background-color:${HEX[i]}">${n}</span>`;
const cardH=id=>{const c=C[id];return `<div class="card ${selC===id?'sel':''}" data-c="${id}"><div class="top" style="background:linear-gradient(135deg,${HEX[c.o]},#0005)"><b>${c.p?'⭐'+c.p:''}</b><span class="em">${GE[c.o]}</span></div><div class="cost">${c.c.map((n,i)=>n?`<span><i class="dot" style="background-color:${HEX[i]}"></i>${n}</span>`:'').join('')}</div></div>`};
function lobbyUI(pre){app.innerHTML=`<div class="lab">🎮 เริ่มเล่น</div><div class="row" style="margin-top:8px"><input id="nm" placeholder="👤 ชื่อของคุณ" value="${myName}" maxlength="14"></div>
<div class="row" style="margin-top:12px"><button class="b" id="mk">🏰 สร้างห้องใหม่</button><span>หรือ</span><input id="cd" placeholder="🔑 รหัสห้อง" size="7" maxlength="4" style="text-transform:uppercase" value="${pre||''}"><button class="b" id="jn">🚪 เข้าร่วม</button></div><p id="er" class="warn"></p>`;
  $('#mk').onclick=createRoom;$('#jn').onclick=joinRoom}
function render(){if(!S)return;sfxCheck();
  if(S.phase==='lobby'){const host=S.host===uid;
    app.innerHTML=`<div class="lab">🔑 รหัสห้อง</div><div style="font-size:46px;font-weight:700;color:var(--gold);letter-spacing:8px">${code}</div>
    <p>📨 ส่งลิงก์หน้านี้ให้เพื่อน (ต่อท้ายด้วย <b>#${code}</b>) หรือบอกรหัสห้อง</p>
    <div class="panel"><div class="lab">👥 ผู้เล่น ${S.players.length}/4</div>${S.players.map(p=>`<div class="pn" style="margin:6px 0">${p.av||'🙂'} ${p.name}${p.uid===S.host?' 👑':''}</div>`).join('')}</div>
    ${host?`<button class="b" data-a="start" ${S.players.length<2?'disabled':''}>🚀 เริ่มเกม</button>`:'⏳ รอเจ้าของห้องกดเริ่มเกม...'} <span class="warn">${msg}</span>`;return}
  const m=myIdx();if(m<0){app.textContent='เกมนี้เริ่มไปแล้ว และคุณไม่ได้อยู่ในห้อง';return}
  const mp=S.players[m],cur=S.players[S.turn],mt=myTurn();
  let h=`<div class="row" style="justify-content:space-between"><span class="lab">🔑 ห้อง ${code}</span><span class="warn">${msg}</span></div>`;
  if(S.phase==='over'){const r=S.players.map(p=>({p,s:pts(p),n:p.cards.length})).sort((a,b)=>b.s-a.s||a.n-b.n);
    h+=`<div class="panel"><div class="banner">🏆 ผู้ชนะ: ${r[0].p.av||''} ${r[0].p.name} (${r[0].s} แต้ม) 🎉</div>${r.map((x,i)=>`<div style="margin:8px 0">${['🥇','🥈','🥉','🎖️'][i]} ${x.p.av||''} ${x.p.name}: ${x.s} แต้ม · ${x.n} การ์ด</div>`).join('')}${S.host===uid?'<button class="b" data-a="again">🔄 เล่นใหม่</button>':''}</div>`}
  else h+=`<div class="banner" style="${mt?'':'animation:none;background:#0006;color:#f5f1ff'}">${mt?'🎲 ตาของคุณ!':'⏳ ตาของ '+(cur.av||'')+' '+cur.name}</div>`;
  h+=`<div class="panel"><div class="lab">👑 ขุนนาง (+3 แต้ม)</div><div class="row" style="margin-top:6px">${S.nobles.map(k=>`<div class="noble">👑<div class="r">${NB[k].map((n,i)=>n?pip(i,n):'').join('')}</div></div>`).join('')}</div></div><div class="panel">`;
  [2,1,0].forEach(l=>{h+=`<div class="lv"><div class="deck"><b>${['🥉','🥈','🥇'][l]} ระดับ ${'I'.repeat(l+1)}</b><span>เหลือ ${S.deck[l].length}</span>${mt&&!S.disc&&mp.res.length<3&&S.deck[l].length?`<button class="b" style="padding:4px 10px;font-size:12px" data-rd="${l}">🔒 จอง</button>`:''}</div>${S.table[l].map(id=>id==null?'<div class="card empty"></div>':cardH(id)).join('')}</div>`});
  h+=`</div><div class="panel"><div class="lab">🪙 กองเหรียญกลาง</div><div class="row" style="margin-top:10px">${[0,1,2,3,4,5].map(i=>{const k=sel.filter(x=>x===i).length;return `<button class="gem ${k?'s':''}" style="background-color:${HEX[i]}" data-g="${i}" ${i===5?'disabled':''}><span class="e">${GE[i]}</span>${S.bank[i]}${k?'<sup>+'+k+'</sup>':''}</button>`}).join('')}</div>`;
  if(mt&&!S.disc){const av=[0,1,2,3,4].filter(i=>S.bank[i]>0).length;
    const ok=sel.length&&(sel.length===2&&sel[0]===sel[1]||new Set(sel).size===sel.length&&sel.length===Math.min(3,av));const inR=selC!=null&&mp.res.includes(selC);
    h+=`<div class="row" style="margin-top:14px"><button class="b" data-a="take" ${ok?'':'disabled'}>🪙 เก็บเหรียญ</button><button class="b" data-a="buy" ${selC!=null&&canBuy(mp,selC)?'':'disabled'}>🛒 ซื้อการ์ด</button><button class="b" data-a="res" ${selC!=null&&!inR&&mp.res.length<3?'':'disabled'}>🔒 จองการ์ด</button><button class="b" data-a="clr">🧹 ล้าง</button></div><small>💡 เหรียญ: 3 สีต่างกัน หรือ 2 เหรียญสีเดียวกัน (กองต้องมี 4+)</small>`}
  if(mt&&S.disc)h+=`<p class="warn">⚠️ เหรียญเกิน 10! กดเหรียญของคุณด้านล่างเพื่อคืน</p>`;
  h+='</div>';
  [...S.players.keys()].sort((a,b)=>(b===m)-(a===m)).forEach(i=>{const p=S.players[i],b=bon(p);
    h+=`<div class="p ${i===m?'me':''} ${i===S.turn&&S.phase==='play'?'turn':''}"><span class="sc">⭐ ${pts(p)}</span><div class="pn">${p.av||'🙂'} ${p.name}${i===m?' (คุณ)':''} · 🃏 ${p.cards.length}${p.nobles.length?' · 👑'+p.nobles.length:''}</div>
    <div style="margin-top:6px"><span class="lab">🃏 โบนัส</span> ${b.map((n,k)=>pip(k,n)).join('')}</div>
    <div style="margin-top:4px"><span class="lab">🪙 เหรียญ</span> ${p.g.map((n,k)=>i===m&&S.disc&&mt?`<button class="pip mini" style="background-color:${HEX[k]};cursor:pointer" data-d="${k}">${n}</button>`:pip(k,n)).join('')}</div>
    ${p.res.length?`<div class="row" style="margin-top:8px">${p.res.map(id=>i===m?cardH(id):'<div class="card" style="background:#4c1d95">🔒</div>').join('')}</div>`:''}</div>`});
  h+=`<div class="panel log">📜 ${S.log.slice().reverse().join('<br>')}</div>`;app.innerHTML=h}
document.addEventListener('click',e=>{const t=e.target.closest('[data-g],[data-c],[data-a],[data-rd],[data-d]');if(!t||!S)return;msg='';const d=t.dataset;
  if(d.d!=null)return send({t:'disc',i:+d.d});
  if(d.g!=null&&myTurn()&&!S.disc){const i=+d.g;sfx('tick');
    if(sel.length===3||sel.length===2&&sel[0]===sel[1])sel=[i];
    else if(sel.length===1&&sel[0]===i){S.bank[i]>=4?sel=[i,i]:msg='กองนี้เหลือไม่ถึง 4 เก็บ 2 เหรียญไม่ได้'}
    else if(sel.includes(i))sel=sel.filter(x=>x!==i);else sel.push(i);return render()}
  if(d.c!=null){sfx('tick');selC=selC===+d.c?null:+d.c;return render()}
  if(d.rd!=null)return send({t:'res',deck:+d.rd});
  ({take:()=>send({t:'take',sel}),buy:()=>send({t:'buy',id:selC}),res:()=>send({t:'res',id:selC}),clr:()=>{sel=[];selC=null;render()},start:()=>send({t:'start'}),again:()=>send({t:'again'})})[d.a]?.()});
lobbyUI(location.hash.replace('#','').toUpperCase());
</script></body></html>
